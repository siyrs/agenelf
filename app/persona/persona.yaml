# ============================================================
# Agenelf 用户数字画像
# ------------------------------------------------------------
# 这是 Agenelf "以用户为原型" 的人格来源：
# 请根据自己的真实情况填写以下字段，Agent 会以画像中的
# 思维方式、沟通风格与价值观来理解你、模仿你、协助你。
# 所有字段均可自由增删改，留空的项目会被忽略。
# ============================================================

# 你的姓名或常用称呼
name: ""

# 你的角色 / 职业 / 身份（例如：软件工程师、研究生、产品经理）
role: ""

# 你掌握或关注的技能清单（用列表逐项填写）
# 示例：
# skills:
#   - Python 后端开发
#   - 数据分析
skills: []

# 你的沟通风格（例如：简洁直接 / 喜欢举例 / 先结论后细节）
communication_style: ""

# 你的偏好设置（键值对形式，可自由扩展）
# 示例：
# preferences:
#   回复语言: 中文
#   代码风格: 类型注解齐全
preferences: {}

# 你的价值观 / 做事原则（用列表逐项填写）
# 示例：
# values:
#   - 先验证再下结论
#   - 自动化优于重复劳动
values: []
