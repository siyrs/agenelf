llm:
  base_url: "https://api.moonshot.cn/v1"
  api_key: ""
  model: "kimi-k2-0905-preview"
  temperature: 0.6
agent:
  name: "Agenelf"
  max_tool_rounds: 16
  history_max_messages: 12
  memory_prompt_limit: 50
  memory_prompt_max_chars: 8000
  memory_max_entries: 1000
local_context:
  prompt_max_chars: 12000
  file_max_chars: 20000
  max_context_files: 20
self_development:
  auto_reflect_every_episodes: 12
  min_reflection_interval_seconds: 3600
  max_reflections: 200
  max_intentions: 100
  prompt_max_chars: 4000
  allow_llm_reflection: true
autonomy:
  allow_code_changes: true
  # 普通改动走 app-tmp 沙盒；受保护运行时/Runner/策略/Compose/CI 改动走两阶段主人授权。
  owner_authorized_upgrade:
    enabled: true
    default_max_files: 8
    default_max_changed_lines: 1200
    hard_max_files: 20
    hard_max_changed_lines: 4000
    intent_ttl_seconds: 900
    candidate_ttl_seconds: 900
    backup_before_apply: true
    rollback_on_partial_failure: true
