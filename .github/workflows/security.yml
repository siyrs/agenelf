name: Security & Supply Chain

# 供应链与安全门禁。与 docs/SAFETY_POLICY.md 第 6 节保持同步。
# 诚实约束：本文件中的第三方 Action 当前使用版本标签引用，尚未固定到
# 完整 commit SHA；每个 uses 上方的 TODO 注释不得在固定前删除。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    name: Governance policy lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # TODO(供应链): 固定到完整 commit SHA，参考 GitHub 官方建议
      - uses: actions/checkout@v4
      # TODO(供应链): 固定到完整 commit SHA，参考 GitHub 官方建议
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install governance validator dependency
        run: python -m pip install --disable-pip-version-check 'pyyaml>=6.0'
      - name: Validate governance policy
        run: python scripts/validate_governance.py
      - name: Compile governance validator
        run: python -m py_compile scripts/validate_governance.py

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # TODO(供应链): 固定到完整 commit SHA，参考 GitHub 官方建议
      - uses: actions/checkout@v4
      # TODO(供应链): 固定到完整 commit SHA，参考 GitHub 官方建议
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit and project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r app/requirements.txt
      - name: Generate dependency vulnerability report
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pip-audit --progress-spinner off --format json --output pip-audit.json
          audit_status=$?
          set -e
          echo "pip-audit exit status: ${audit_status}"
          test -s pip-audit.json
      - name: Enforce fixable-vulnerability policy
        run: python scripts/evaluate_pip_audit.py pip-audit.json
      # TODO(供应链): 固定到完整 commit SHA，参考 GitHub 官方建议
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
          retention-days: 30

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # TODO(供应链): 固定到完整 commit SHA，参考 GitHub 官方建议
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert private paths are not tracked
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '^(local/secrets/|\.env$|\.ops-runner\.env$|\.env\.github$)'
      # TODO(供应链): 固定到完整 commit SHA，参考 GitHub 官方建议；
      # gitleaks 建议同时固定 gitleaks-action 版本与 GITLEAKS_VERSION。
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.18.4"
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # TODO(供应链): 固定到完整 commit SHA，参考 GitHub 官方建议
      - uses: actions/checkout@v4
      # TODO(供应链): 固定到完整 commit SHA，参考 GitHub 官方建议
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cyclonedx-bom and project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom
          pip install -r app/requirements.txt
      - name: Generate SBOM
        run: cyclonedx-py environment --of JSON --output-file sbom.json
      # TODO(供应链): 固定到完整 commit SHA，参考 GitHub 官方建议
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

  shellcheck:
    name: ShellCheck scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # TODO(供应链): 固定到完整 commit SHA，参考 GitHub 官方建议
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        id: shellcheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > shellcheck.log
          while IFS= read -r -d '' script; do
            shellcheck --severity=warning "$script" 2>&1 | tee -a shellcheck.log
          done < <(find scripts shared/scripts -maxdepth 1 -type f -name '*.sh' -print0)
      # TODO(供应链): 固定到完整 commit SHA，参考 GitHub 官方建议
      - name: Upload ShellCheck diagnostics
        if: steps.shellcheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: shellcheck-diagnostics
          path: shellcheck.log
          retention-days: 30
      - name: Stop after ShellCheck failure
        if: steps.shellcheck.outcome == 'failure'
        run: exit 1
