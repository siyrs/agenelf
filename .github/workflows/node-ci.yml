name: Node Runtime CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install locked dependency-free workspace
        run: npm ci --ignore-scripts
      - name: Check native TypeScript syntax
        run: npm run node:check
      - name: Run Node unit and integration tests
        id: node_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run node:test 2>&1 | tee node-test.log
      - name: Upload Node test diagnostics
        if: steps.node_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: node-test-log
          path: node-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Stop after Node test failure
        if: steps.node_tests.outcome == 'failure'
        run: exit 1
      - name: Prepare private-path fixtures
        run: |
          cp .env.example .env
          printf '\nAGENELF_API_TOKEN=node-ci-token\n' >> .env
          cp .ops-runner.env.example .ops-runner.env
          python scripts/init_local.py --no-migrate >/tmp/agenelf-init.json
          cp local/node-runner.example.json local/node-runner.json
          mkdir -p data/node-tasks data/node-runner-requests data/node-runner-results data/node-runner-locks
      - name: Validate default hybrid production topology
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --format json > /tmp/agenelf-production-compose.json
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('/tmp/agenelf-production-compose.json', 'utf8'));
          const services = config.services || {};
          const required = [
            'agenelf', 'legacy-agent', 'approval-key-init', 'approval-runner',
            'ops-runner', 'validation-runner', 'repair-runner', 'self-upgrade-runner'
          ];
          for (const name of required) {
            if (!services[name]) throw new Error(`missing production service: ${name}`);
          }
          const node = services.agenelf;
          const legacy = services['legacy-agent'];
          const dockerfile = typeof node.build === 'object' ? String(node.build.dockerfile || '') : '';
          if (!dockerfile.endsWith('Dockerfile.node')) throw new Error(`agenelf must build Dockerfile.node, got ${dockerfile}`);
          const env = node.environment || {};
          if (String(env.AGENELF_LEGACY_API_URL || '') !== 'http://legacy-agent:8000') {
            throw new Error('Node API must use the internal legacy-agent URL');
          }
          if (!Array.isArray(node.ports) || !node.ports.length) throw new Error('Node API must expose the public port');
          if (Array.isArray(legacy.ports) && legacy.ports.length) throw new Error('legacy-agent must not expose a host port');
          const mounts = (service) => (service.volumes || []).map((item) => typeof item === 'string' ? item : `${item.source || ''}:${item.target || ''}:${item.read_only ? 'ro' : 'rw'}`);
          const nodeMounts = mounts(node).join('\n');
          if (nodeMounts.includes('local/secrets') || nodeMounts.includes('/agenelf/approval')) {
            throw new Error('Node Agent must not receive secrets or approval keys');
          }
          if (!nodeMounts.includes('/agenelf/policy:ro') || !nodeMounts.includes('/agenelf/data/runner-health:ro')) {
            throw new Error('Node Agent must retain read-only policy and runner-health observability');
          }
          if (services['approval-runner'].network_mode !== 'none') throw new Error('approval-runner must remain networkless');
          if (services['repair-runner'].network_mode !== 'none') throw new Error('repair-runner must remain networkless');
          const approvalMounts = mounts(services['approval-runner']).join('\n');
          if (!approvalMounts.includes('/agenelf/approval:ro')) throw new Error('approval-runner must retain the read-only HMAC key');
          const opsMounts = mounts(services['ops-runner']).join('\n');
          if (!opsMounts.includes('/agenelf/local/secrets:ro')) throw new Error('only ops-runner should read server secrets');
          console.log(`validated ${Object.keys(services).length} explicit production services`);
          NODE
      - name: Validate rollback and optional Node runner topologies
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.python.yml config --format json > /tmp/agenelf-python-compose.json
          docker compose --profile node-runner config --format json > /tmp/agenelf-node-runner-compose.json
          node <<'NODE'
          const fs = require('node:fs');
          const python = JSON.parse(fs.readFileSync('/tmp/agenelf-python-compose.json', 'utf8'));
          const optional = JSON.parse(fs.readFileSync('/tmp/agenelf-node-runner-compose.json', 'utf8'));
          if (!python.services?.agenelf || !python.services?.['approval-runner']) throw new Error('Python rollback topology incomplete');
          if (!optional.services?.['node-runner']) throw new Error('optional Node runner profile missing');
          if (optional.services['node-runner'].network_mode !== 'none') throw new Error('Node runner must remain networkless');
          NODE
      - name: Build Node production image
        run: docker build -f Dockerfile.node -t agenelf-node:ci .
      - name: Smoke Node API container
        env:
          AGENELF_API_TOKEN: node-ci-token
        run: |
          docker run -d --rm --name agenelf-node-ci \
            -e AGENELF_API_TOKEN=node-ci-token \
            -p 127.0.0.1:18080:8000 \
            agenelf-node:ci
          trap 'docker rm -f agenelf-node-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/health && break
            sleep 1
          done
          curl -fsS -H 'X-Agenelf-Token: node-ci-token' http://127.0.0.1:18080/status | grep -q 'node-typescript'
      - name: Smoke default Node plus internal legacy topology
        run: |
          docker compose up -d --build approval-key-init legacy-agent agenelf
          trap 'docker compose down -v >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS -H 'X-Agenelf-Token: node-ci-token' http://127.0.0.1:8000/status | grep -q 'node-typescript'
          curl -fsS -H 'X-Agenelf-Token: node-ci-token' http://127.0.0.1:8000/self/roadmap >/tmp/legacy-proxy-smoke.json
          test -s /tmp/legacy-proxy-smoke.json

  node-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - run: npm ci --ignore-scripts
      - name: Assert no runtime npm dependencies
        run: |
          node -e 'const p=require("./package.json"); if (Object.keys(p.dependencies||{}).length) process.exit(1)'
      - name: Audit npm lock
        run: npm audit --omit=dev --audit-level=high
      - name: Generate npm SBOM
        run: npm sbom --sbom-format cyclonedx > node-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: node-sbom
          path: node-sbom.json
          retention-days: 30
