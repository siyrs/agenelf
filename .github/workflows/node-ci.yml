name: Node Runtime CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install locked dependency-free workspace
        run: npm ci --ignore-scripts
      - name: Check native TypeScript syntax
        run: npm run node:check
      - name: Run Node unit and integration tests
        id: node_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run node:test 2>&1 | tee node-test.log
      - name: Upload Node test diagnostics
        if: steps.node_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: node-test-log
          path: node-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Stop after Node test failure
        if: steps.node_tests.outcome == 'failure'
        run: exit 1
      - name: Prepare private-path fixtures
        run: |
          cp .env.example .env
          {
            printf '\nAGENELF_API_TOKEN=node-ci-token\n'
            printf 'AGENELF_UID=%s\n' "$(id -u)"
            printf 'AGENELF_GID=%s\n' "$(id -g)"
          } >> .env
          cp .ops-runner.env.example .ops-runner.env
          python scripts/init_local.py --no-migrate >/tmp/agenelf-init.json
          cp local/node-runner.example.json local/node-runner.json
          mkdir -p \
            workspace/tasks local/prompts \
            data/tasks data/node-tasks \
            data/auth-requests data/auth-decisions \
            data/ops-requests data/ops-results data/ops-events \
            data/validation-requests data/validation-results \
            data/repair-requests data/repair-results data/repair-events \
            data/authorized-upgrades data/self-upgrade-results data/self-upgrade-events \
            data/promote-requests data/promotion-history \
            data/autonomy-cycles data/autonomy-events \
            data/runner-health data/node-runner-requests data/node-runner-results data/node-runner-locks
      - name: Validate Node-only production topology
        id: topology
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            docker compose --profile cli config --format json > agenelf-production-compose.json
            node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('agenelf-production-compose.json', 'utf8'));
          const services = config.services || {};
          const required = [
            'agenelf', 'cli', 'approval-key-init', 'approval-runner',
            'read-ops-runner', 'change-ops-runner', 'validation-runner',
            'node-repair-runner', 'node-self-upgrade-runner'
          ];
          for (const name of required) if (!services[name]) throw new Error(`missing production service: ${name}`);
          for (const forbidden of ['legacy-agent', 'ops-runner', 'repair-runner', 'self-upgrade-runner', 'legacy-cli']) {
            if (services[forbidden]) throw new Error(`Python compatibility service rendered by default: ${forbidden}`);
          }
          for (const [name, service] of Object.entries(services)) {
            const command = Array.isArray(service.command) ? service.command.join(' ') : String(service.command || '');
            const dockerfile = typeof service.build === 'object' ? String(service.build.dockerfile || '') : '';
            if (/\bpython(?:3)?\b|\/agenelf\/app\/api\.py|legacy-agent/.test(command)) throw new Error(`default service ${name} has Python/legacy command: ${command}`);
            if (dockerfile === 'Dockerfile' && name !== 'approval-key-init') throw new Error(`default service ${name} uses Python Dockerfile`);
          }
          const node = services.agenelf;
          const changeOps = services['change-ops-runner'];
          const nodeRepair = services['node-repair-runner'];
          const nodeUpgrade = services['node-self-upgrade-runner'];
          const dockerfile = typeof node.build === 'object' ? String(node.build.dockerfile || '') : '';
          if (!dockerfile.endsWith('Dockerfile.node')) throw new Error(`agenelf must build Dockerfile.node, got ${dockerfile}`);
          const env = Array.isArray(node.environment)
            ? Object.fromEntries(node.environment.map((item) => String(item).split(/=(.*)/s).slice(0, 2)))
            : (node.environment || {});
          if ('AGENELF_LEGACY_API_URL' in env) throw new Error('Node API still receives AGENELF_LEGACY_API_URL');
          if (node.depends_on?.['legacy-agent']) throw new Error('Node API still depends on legacy-agent');
          if (!Array.isArray(node.ports) || !node.ports.length) throw new Error('Node API must expose the public port');
          const volumes = (service) => Array.isArray(service?.volumes) ? service.volumes : [];
          const target = (item) => typeof item === 'string' ? item.split(':')[1] : item.target;
          const readOnly = (item) => typeof item === 'string' ? item.split(':')[2] === 'ro' : Boolean(item.read_only);
          const has = (service, path, ro) => volumes(service).some((item) => target(item) === path && (ro === undefined || readOnly(item) === ro));
          const sources = (service) => volumes(service).map((item) => typeof item === 'string' ? item : String(item.source || '')).join('\n');
          for (const [path, ro] of [
            ['/agenelf/local/memory', false], ['/agenelf/local/self', false],
            ['/agenelf/data/auth-requests', true], ['/agenelf/data/ops-requests', false],
            ['/agenelf/data/repair-requests', false], ['/agenelf/data/authorized-upgrades', true],
            ['/agenelf/data/autonomy-cycles', false], ['/agenelf/data/autonomy-events', false],
            ['/agenelf/data/runner-health', true]
          ]) if (!has(node, path, ro)) throw new Error(`Node API missing native data mount ${path}:${ro ? 'ro' : 'rw'}`);
          for (const forbidden of ['local/secrets', '/agenelf/approval', 'docker.sock', '/agenelf/app-fork']) {
            if (sources(node).includes(forbidden)) throw new Error(`Node API received forbidden/Python runtime source: ${forbidden}`);
          }
          if (services['approval-runner'].network_mode !== 'none') throw new Error('approval-runner must remain networkless');
          if (!has(services['approval-runner'], '/agenelf/approval', true)) throw new Error('approval-runner must retain read-only HMAC key');
          if (!changeOps.read_only || !has(changeOps, '/agenelf/local/secrets', true) || has(changeOps, '/agenelf/approval')) throw new Error('change Ops trust boundary invalid');
          if (nodeRepair.network_mode !== 'none' || !nodeRepair.read_only || !has(nodeRepair, '/agenelf/code-workspaces', true) || !has(nodeRepair, '/agenelf/repair-space', false)) throw new Error('Repair trust boundary invalid');
          if (nodeUpgrade.network_mode !== 'none' || !nodeUpgrade.read_only || !has(nodeUpgrade, '/agenelf/app-tmp', true) || !has(nodeUpgrade, '/agenelf/data/auth-consumed', false) || has(nodeUpgrade, '/agenelf/approval')) throw new Error('Self-upgrade trust boundary invalid');
          console.log(`validated ${Object.keys(services).length} Node-only production services`);
          NODE
          } 2>&1 | tee topology-validation.log
      - name: Upload topology diagnostics
        if: steps.topology.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: node-topology-diagnostics
          path: |
            topology-validation.log
            agenelf-production-compose.json
          if-no-files-found: error
          retention-days: 1
      - name: Stop after topology failure
        if: steps.topology.outcome == 'failure'
        run: exit 1
      - name: Validate explicit Python diagnostics and complete rollback
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.python.yml config --format json > /tmp/agenelf-python-compose.json
          docker compose --profile node-runner --profile python-repair --profile python-ops --profile python-self-upgrade --profile python-legacy-api config --format json > /tmp/agenelf-audit-compose.json
          node <<'NODE'
          const fs = require('node:fs');
          const python = JSON.parse(fs.readFileSync('/tmp/agenelf-python-compose.json', 'utf8')).services || {};
          const audit = JSON.parse(fs.readFileSync('/tmp/agenelf-audit-compose.json', 'utf8')).services || {};
          for (const name of ['agenelf', 'approval-runner', 'repair-runner', 'ops-runner', 'self-upgrade-runner']) if (!python[name]) throw new Error(`Python rollback missing ${name}`);
          for (const forbidden of ['read-ops-runner', 'change-ops-runner', 'node-self-upgrade-runner']) if (python[forbidden]) throw new Error(`Python rollback unexpectedly includes ${forbidden}`);
          if (!audit['node-runner'] || audit['node-runner'].network_mode !== 'none') throw new Error('optional Node runner missing or networked');
          if (!audit['legacy-agent']?.profiles?.includes('python-legacy-api')) throw new Error('profile-gated Python legacy API missing');
          if (!audit['repair-runner']?.profiles?.includes('python-repair')) throw new Error('profile-gated Python repair missing');
          if (!audit['ops-runner']?.profiles?.includes('python-ops')) throw new Error('profile-gated Python Ops missing');
          if (!audit['self-upgrade-runner']?.profiles?.includes('python-self-upgrade')) throw new Error('profile-gated Python Self-upgrade missing');
          NODE
      - name: Build Node production image
        run: docker build -f Dockerfile.node -t agenelf-node:ci .
      - name: Smoke standalone Node API container
        run: |
          docker run -d --rm --name agenelf-node-ci \
            -e AGENELF_API_TOKEN=node-ci-token \
            -p 127.0.0.1:18080:8000 \
            agenelf-node:ci
          trap 'docker rm -f agenelf-node-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/health && break; sleep 1; done
          curl -fsS -H 'X-Agenelf-Token: node-ci-token' http://127.0.0.1:18080/status | grep -q 'node-typescript'
      - name: Smoke default Node-only Compose topology
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose ps || true
              docker compose logs --no-color --tail=200 agenelf approval-runner validation-runner || true
            fi
            docker compose down -v >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          docker compose up -d --build approval-key-init agenelf
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/node-health.json; then break; fi
            sleep 1
          done
          status=$(curl -fsS -H 'X-Agenelf-Token: node-ci-token' http://127.0.0.1:8000/status)
          echo "$status" | grep -q 'node-typescript'
          echo "$status" | grep -q '"legacy_api":false'
          curl -fsS -H 'X-Agenelf-Token: node-ci-token' http://127.0.0.1:8000/self/development | grep -q 'continuity_id'
          curl -fsS -H 'X-Agenelf-Token: node-ci-token' http://127.0.0.1:8000/self/optimization | grep -q 'consciousness_claim'
          curl -fsS -X POST -H 'X-Agenelf-Token: node-ci-token' -H 'Content-Type: application/json' -d '{"goal":"verify Node-only production","apply_changes":false}' http://127.0.0.1:8000/autonomy/cycles | grep -q 'plan_ready'
          test -z "$(docker compose ps --services --status running | grep -E 'legacy-agent|ops-runner$|repair-runner$|self-upgrade-runner$' || true)"

  node-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - run: npm ci --ignore-scripts
      - name: Assert no runtime npm dependencies
        run: |
          node -e 'const p=require("./package.json"); if (Object.keys(p.dependencies||{}).length) process.exit(1)'
      - name: Audit npm lock
        run: npm audit --omit=dev --audit-level=high
      - name: Generate npm SBOM
        run: npm sbom --sbom-format cyclonedx > node-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: node-sbom
          path: node-sbom.json
          retention-days: 30
