name: Node Runtime CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install locked dependency-free workspace
        run: npm ci --ignore-scripts
      - name: Check native TypeScript syntax
        run: npm run node:check
      - name: Run Node unit and integration tests
        run: npm run node:test
      - name: Prepare private-path fixtures
        run: |
          cp .env.example .env
          printf '\nAGENELF_API_TOKEN=node-ci-token\n' >> .env
          cp .ops-runner.env.example .ops-runner.env
          python scripts/init_local.py --no-migrate >/tmp/agenelf-init.json
          cp local/node-runner.example.json local/node-runner.json
          mkdir -p data/node-tasks data/node-runner-requests data/node-runner-results data/node-runner-locks
      - name: Validate default hybrid production topology
        run: |
          docker compose config > /tmp/agenelf-production-compose.yml
          docker compose config --services > /tmp/agenelf-production-services.txt
          grep -qx 'agenelf' /tmp/agenelf-production-services.txt
          grep -qx 'legacy-agent' /tmp/agenelf-production-services.txt
          grep -qx 'approval-runner' /tmp/agenelf-production-services.txt
          grep -qx 'ops-runner' /tmp/agenelf-production-services.txt
          grep -qx 'validation-runner' /tmp/agenelf-production-services.txt
          grep -qx 'repair-runner' /tmp/agenelf-production-services.txt
          grep -qx 'self-upgrade-runner' /tmp/agenelf-production-services.txt
          grep -q 'Dockerfile.node' /tmp/agenelf-production-compose.yml
          grep -q 'AGENELF_LEGACY_API_URL' /tmp/agenelf-production-compose.yml
      - name: Validate rollback and optional Node runner topologies
        run: |
          docker compose -f docker-compose.python.yml config >/tmp/agenelf-python-compose.yml
          docker compose --profile node-runner config >/tmp/agenelf-node-runner-compose.yml
          grep -q 'node-runner:' /tmp/agenelf-node-runner-compose.yml
      - name: Build Node production image
        run: docker build -f Dockerfile.node -t agenelf-node:ci .
      - name: Smoke Node API container
        env:
          AGENELF_API_TOKEN: node-ci-token
        run: |
          docker run -d --rm --name agenelf-node-ci \
            -e AGENELF_API_TOKEN=node-ci-token \
            -p 127.0.0.1:18080:8000 \
            agenelf-node:ci
          trap 'docker rm -f agenelf-node-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/health && break
            sleep 1
          done
          curl -fsS -H 'X-Agenelf-Token: node-ci-token' http://127.0.0.1:18080/status | grep -q 'node-typescript'
      - name: Smoke default Node plus internal legacy topology
        run: |
          docker compose up -d --build approval-key-init legacy-agent agenelf
          trap 'docker compose down -v >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS -H 'X-Agenelf-Token: node-ci-token' http://127.0.0.1:8000/status | grep -q 'node-typescript'
          curl -fsS -H 'X-Agenelf-Token: node-ci-token' http://127.0.0.1:8000/self/roadmap >/tmp/legacy-proxy-smoke.json
          test -s /tmp/legacy-proxy-smoke.json

  node-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - run: npm ci --ignore-scripts
      - name: Assert no runtime npm dependencies
        run: |
          node -e 'const p=require("./package.json"); if (Object.keys(p.dependencies||{}).length) process.exit(1)'
      - name: Audit npm lock
        run: npm audit --omit=dev --audit-level=high
      - name: Generate npm SBOM
        run: npm sbom --sbom-format cyclonedx > node-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: node-sbom
          path: node-sbom.json
          retention-days: 30
