name: Apply agent-generated repository payload

on:
  push:
    branches: [agent/persistent-self-development]
    paths:
      - '.agent-payload/**'
      - '.github/workflows/apply-agent-payload.yml'

permissions:
  contents: write

concurrency:
  group: apply-agent-payload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persistent-self-development
          fetch-depth: 0
      - name: Validate, decode and extract payload
        shell: bash
        run: |
          set -euo pipefail
          test -d .agent-payload
          cat .agent-payload/part-* | base64 --decode > /tmp/agenelf-payload.tar.xz
          python - <<'PY'
          import tarfile
          from pathlib import PurePosixPath

          archive = '/tmp/agenelf-payload.tar.xz'
          with tarfile.open(archive, 'r:xz') as tf:
              for member in tf.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe payload path: {member.name}')
                  if member.issym() or member.islnk():
                      raise SystemExit(f'links are not allowed: {member.name}')
              tf.extractall('.')
          PY
          rm -rf .agent-payload .github/workflows/apply-agent-payload.yml
      - name: Commit expanded implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Agenelf Release Bot'
          git config user.email 'agenelf-release-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add persistent self-development intentions'
          git push origin HEAD:agent/persistent-self-development
