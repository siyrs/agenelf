name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r app/requirements.txt
      - name: Validate governance policy
        run: python scripts/validate_governance.py
      - name: Compile Python sources
        run: python -m compileall -q app scripts
      - name: Run unit tests
        working-directory: app
        run: python -m unittest discover -s tests -v
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -maxdepth 1 -type f -name '*.sh' -print0)
