name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r app/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app scripts
      - name: Run unit tests
        working-directory: app
        run: python -m unittest discover -s tests -v
      - name: Validate shell scripts
        run: |
          bash -n scripts/approve.sh
          bash -n scripts/chat.sh
          bash -n scripts/gate_check.sh
          bash -n scripts/github_backup.sh
          bash -n scripts/github_release.sh
          bash -n scripts/github_setup.sh
          bash -n scripts/promote.sh
          bash -n scripts/sync_fork.sh
          bash -n scripts/watcher.sh
