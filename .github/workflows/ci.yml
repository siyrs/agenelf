name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r app/requirements.txt
      - name: Validate governance policy
        run: python scripts/validate_governance.py
      - name: Compile governance validator
        run: python -m py_compile scripts/validate_governance.py
      - name: Compile Python sources
        run: python -m compileall -q app scripts
      - name: Run unit tests
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee ../unit-test.log
      - name: Upload unit test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-log
          path: unit-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Validate local initialization and Docker topology
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          cp .ops-runner.env.example .ops-runner.env
          python scripts/init_local.py --no-migrate > /tmp/agenelf-init.json
          grep -q '"models": true' /tmp/agenelf-init.json
          grep -q '"validation": true' /tmp/agenelf-init.json
          docker compose config > /tmp/agenelf-compose.yaml
          grep -q 'validation-runner:' /tmp/agenelf-compose.yaml
          grep -q 'AGENELF_MODELS_FILE' /tmp/agenelf-compose.yaml
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -maxdepth 1 -type f -name '*.sh' -print0)

  windows-approval:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install Windows CLI dependencies
        run: python -m pip install pyyaml rich prompt-toolkit
      - name: Verify slash command palette and Tab completion
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path app).Path
          python -m unittest discover -s app/tests -p test_interactive_prompt.py -v
      - name: Create a request with a deliberately stale app-fork
        shell: pwsh
        run: |
          python scripts/init_local.py --no-migrate | Out-Null
          New-Item -ItemType Directory -Path app-fork/core -Force | Out-Null
          'raise RuntimeError("stale app-fork was imported")' |
            Set-Content -Path app-fork/core/owner_approval.py -Encoding UTF8
          @'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path("app").resolve()))
          from core import operations
          request = operations.submit_operation(
            "server.operations",
            "apt_update",
            "windows-ci",
            {},
            "change",
            "Windows approval smoke test",
            root=Path(".").resolve(),
          )
          Path("windows-request-id.txt").write_text(request["id"], encoding="utf-8")
          '@ | Set-Content -Path create-windows-request.py -Encoding UTF8
          python create-windows-request.py
      - name: Approve through the real PowerShell entrypoint
        shell: pwsh
        run: |
          $RequestId = (Get-Content windows-request-id.txt -Raw).Trim()
          .\scripts\approve.ps1 $RequestId approve -As windows-ci
      - name: Verify exact decision used app source, not stale app-fork
        shell: pwsh
        run: |
          $RequestId = (Get-Content windows-request-id.txt -Raw).Trim()
          $Decision = Get-Content "data/auth-decisions/$RequestId.json" -Raw |
            ConvertFrom-Json
          if ($Decision.decision -ne "approve") {
            throw "Expected approve decision, got $($Decision.decision)"
          }
          if ($Decision.decided_by -ne "windows-ci") {
            throw "Unexpected approver: $($Decision.decided_by)"
          }
      - name: Revoke approved but not started request through PowerShell
        shell: pwsh
        run: |
          $RequestId = (Get-Content windows-request-id.txt -Raw).Trim()
          .\scripts\revoke.ps1 $RequestId "Windows owner changed scope" -As windows-ci
      - name: Verify revocation won before runner execution
        shell: pwsh
        run: |
          $RequestId = (Get-Content windows-request-id.txt -Raw).Trim()
          $Result = Get-Content "data/ops-results/$RequestId.json" -Raw |
            ConvertFrom-Json
          if ($Result.status -ne "cancelled") {
            throw "Expected cancelled result, got $($Result.status)"
          }
          if ($Result.commands.Count -ne 0) {
            throw "Revoked request unexpectedly contains executed commands"
          }
          if ($Result.cancellation.started -ne $false) {
            throw "Revocation must prove execution had not started"
          }
          if ($Result.cancellation.cancelled_by -ne "windows-ci") {
            throw "Unexpected revoker: $($Result.cancellation.cancelled_by)"
          }
      - name: Run native Windows app-fork synchronization
        shell: pwsh
        run: .\scripts\sync_fork.ps1 -Quiet
      - name: Verify PowerShell sync mirrored the source tree
        shell: pwsh
        run: |
          $Source = (Get-FileHash app/core/owner_approval.py).Hash
          $Runtime = (Get-FileHash app-fork/core/owner_approval.py).Hash
          if ($Source -ne $Runtime) {
            throw "app-fork owner_approval.py does not match app source"
          }
          if (Get-ChildItem app-fork -Recurse -Directory -Filter __pycache__) {
            throw "sync_fork.ps1 copied __pycache__"
          }
          if (Get-ChildItem app-fork -Recurse -File -Filter *.pyc) {
            throw "sync_fork.ps1 copied pyc files"
          }
