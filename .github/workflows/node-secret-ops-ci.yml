name: Node Secret Ops CI

on:
  push:
    branches: [main]
    paths:
      - "node/apps/secret-ops-runner/**"
      - "node/apps/secret-cli/**"
      - "node/apps/secret-chat-broker/**"
      - "node/packages/core/src/secret-ops.ts"
      - "node/packages/core/src/secret-env.ts"
      - "node/packages/core/src/secret-targets.ts"
      - "node/packages/core/src/chat-secret-env.ts"
      - "node/packages/core/src/secret-chat-client.ts"
      - "node/packages/core/src/agent.ts"
      - "node/packages/core/src/types.ts"
      - "node/packages/skills/src/builtin.ts"
      - "node/tests/secret-ops.test.ts"
      - "node/tests/secret-ops-runner.test.ts"
      - "node/tests/chat-secret-env.test.ts"
      - "node/tests/secret-chat-broker.test.ts"
      - "node/resources/secret-ops.json"
      - "app/core/secret_ops_upgrade_policy.py"
      - "app/core/__init__.py"
      - "app/tests/test_node_secret_ops_runner.py"
      - "scripts/init_local.py"
      - "local/env-secrets.example.yaml"
      - "Dockerfile.ops-secret"
      - "compose.yaml"
      - "compose.override.yaml"
      - "compose.secret-chat.yaml"
      - "docs/SECRET_ENV_OPERATIONS.md"
      - "Makefile"
      - ".gitignore"
      - ".github/workflows/node-secret-ops-ci.yml"
  pull_request:
    paths:
      - "node/apps/secret-ops-runner/**"
      - "node/apps/secret-cli/**"
      - "node/apps/secret-chat-broker/**"
      - "node/packages/core/src/secret-ops.ts"
      - "node/packages/core/src/secret-env.ts"
      - "node/packages/core/src/secret-targets.ts"
      - "node/packages/core/src/chat-secret-env.ts"
      - "node/packages/core/src/secret-chat-client.ts"
      - "node/packages/core/src/agent.ts"
      - "node/packages/core/src/types.ts"
      - "node/packages/skills/src/builtin.ts"
      - "node/tests/secret-ops.test.ts"
      - "node/tests/secret-ops-runner.test.ts"
      - "node/tests/chat-secret-env.test.ts"
      - "node/tests/secret-chat-broker.test.ts"
      - "node/resources/secret-ops.json"
      - "app/core/secret_ops_upgrade_policy.py"
      - "app/core/__init__.py"
      - "app/tests/test_node_secret_ops_runner.py"
      - "scripts/init_local.py"
      - "local/env-secrets.example.yaml"
      - "Dockerfile.ops-secret"
      - "compose.yaml"
      - "compose.override.yaml"
      - "compose.secret-chat.yaml"
      - "docs/SECRET_ENV_OPERATIONS.md"
      - "Makefile"
      - ".gitignore"
      - ".github/workflows/node-secret-ops-ci.yml"

permissions:
  contents: read

jobs:
  secret-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          pip install -r app/requirements.txt
      - name: Run focused secret contracts, plaintext chat and governance tests
        run: |
          node --test --test-reporter=spec \
            node/tests/secret-ops.test.ts \
            node/tests/secret-ops-runner.test.ts \
            node/tests/chat-secret-env.test.ts \
            node/tests/secret-chat-broker.test.ts
          PYTHONPATH=app python -m unittest app.tests.test_node_secret_ops_runner -v
      - name: Prepare private fixture files
        run: |
          cp .env.example .env
          {
            printf '\nAGENELF_API_TOKEN=secret-ops-ci-token\n'
            printf 'AGENELF_CHAT_PLAINTEXT_SECRETS=true\n'
            printf 'AGENELF_UID=%s\n' "$(id -u)"
            printf 'AGENELF_GID=%s\n' "$(id -g)"
          } >> .env
          cp .ops-runner.env.example .ops-runner.env
          python scripts/init_local.py --no-migrate > /tmp/init-local.json
          cp local/node-runner.example.json local/node-runner.json
          test -f local/env-secrets.yaml
          grep -q 'targets: {}' local/env-secrets.yaml
      - name: Validate Compose trust boundaries
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile cli --profile secret-cli config --format json > /tmp/secret-compose.json
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('/tmp/secret-compose.json', 'utf8'));
          const services = config.services || {};
          const stagingInit = services['secret-staging-init'];
          const runner = services['secret-ops-runner'];
          const consoleService = services['secret-cli'];
          const chatBroker = services['secret-chat-broker'];
          if (!stagingInit || !runner || !consoleService || !chatBroker) throw new Error('secret staging init, runner, owner console or chat broker missing');
          if (!String(runner.build?.dockerfile || '').endsWith('Dockerfile.ops-secret')) throw new Error('secret runner image mismatch');
          if (!String(chatBroker.build?.dockerfile || '').endsWith('Dockerfile.ops-secret')) throw new Error('secret chat broker image mismatch');
          if (!runner.read_only || !consoleService.read_only || !stagingInit.read_only || !chatBroker.read_only) throw new Error('secret services require read-only root filesystem');
          if (String(stagingInit.network_mode || '') !== 'none') throw new Error('staging init must have no network');
          if (chatBroker.ports && chatBroker.ports.length) throw new Error('secret chat broker must not publish host ports');
          if (!(chatBroker.expose || []).map(String).includes('8097')) throw new Error('secret chat broker must expose only the internal port');
          const capAdd = new Set(stagingInit.cap_add || []);
          if (capAdd.size !== 2 || !capAdd.has('CHOWN') || !capAdd.has('FOWNER')) throw new Error('staging init must add only CHOWN and FOWNER');
          if ((stagingInit.cap_drop || []).length !== 1 || stagingInit.cap_drop[0] !== 'ALL') throw new Error('staging init must drop all other capabilities');
          if ((chatBroker.cap_drop || []).length !== 1 || chatBroker.cap_drop[0] !== 'ALL') throw new Error('secret chat broker must drop all capabilities');
          if (!(consoleService.entrypoint || []).join(' ').includes('node/apps/secret-cli/src/main.ts')) throw new Error('owner console entrypoint mismatch');
          if (!(chatBroker.command || []).join(' ').includes('node/apps/secret-chat-broker/src/main.ts')) throw new Error('secret chat broker command mismatch');
          const mountText = (service) => (service?.volumes || []).map((item) => typeof item === 'string' ? item : `${item.type || ''}:${item.source || ''}:${item.target || ''}:${item.read_only ? 'ro' : 'rw'}`).join('\n');
          const stagingMount = (service) => (service?.volumes || []).find((item) => typeof item === 'object' && item.target === '/agenelf/local/secret-staging');
          for (const service of [stagingInit, runner, consoleService]) {
            const mount = stagingMount(service);
            if (!mount || mount.type !== 'volume' || mount.read_only) throw new Error('secret staging must be a writable Linux named volume');
          }
          const runnerMounts = mountText(runner);
          const consoleMounts = mountText(consoleService);
          const brokerMounts = mountText(chatBroker);
          for (const required of ['/agenelf/local/secrets:ro','/agenelf/local/env-secrets.yaml:ro','/agenelf/data/ops-requests:ro','/agenelf/data/auth-decisions:ro']) {
            if (!runnerMounts.includes(required)) throw new Error(`secret runner missing ${required}`);
          }
          for (const required of ['/agenelf/local/secrets:ro','/agenelf/local/env-secrets.yaml:ro','/agenelf/local/servers.yaml:ro']) {
            if (!brokerMounts.includes(required)) throw new Error(`secret chat broker missing ${required}`);
          }
          if (!consoleMounts.includes('/agenelf/data/ops-requests:rw')) throw new Error('owner console cannot submit request');
          for (const name of ['agenelf', 'cli', 'legacy-agent']) {
            const mounts = mountText(services[name]);
            for (const forbidden of ['/agenelf/local/secrets','/agenelf/local/secret-staging','/agenelf/local/env-secrets.yaml']) {
              if (mounts.includes(forbidden)) throw new Error(`${name} unexpectedly sees ${forbidden}`);
            }
          }
          for (const name of ['secret-staging-init', 'secret-ops-runner', 'secret-cli', 'secret-chat-broker']) {
            const mounts = mountText(services[name]);
            for (const forbidden of ['docker.sock','/agenelf/approval','/agenelf/local/memory','/agenelf/local/self','/agenelf/app-fork']) {
              if (mounts.includes(forbidden)) throw new Error(`${name} has forbidden mount ${forbidden}`);
            }
          }
          for (const forbidden of ['/agenelf/data/auth-decisions','/agenelf/data/ops-requests','/agenelf/data/ops-results']) {
            if (brokerMounts.includes(forbidden)) throw new Error(`secret chat broker unexpectedly sees queue evidence ${forbidden}`);
          }
          NODE
      - name: Build and smoke isolated secret services
        shell: bash
        run: |
          set -euo pipefail
          docker build -f Dockerfile.ops-secret -t agenelf-secret-ops:ci .
          docker run --rm agenelf-secret-ops:ci node --version
          docker run --rm --entrypoint ssh agenelf-secret-ops:ci -V
          docker run --rm --entrypoint python3 agenelf-secret-ops:ci --version
          if ! docker compose --profile secret-cli run --rm -T secret-cli targets | tee /tmp/secret-targets.txt; then
            docker compose logs --no-color secret-staging-init || true
            exit 1
          fi
          docker compose --profile secret-cli run --rm -T secret-cli cleanup --all
          docker compose --profile secret-cli run --rm -T --entrypoint /bin/sh secret-cli -c \
            "test -z \"\$(find /agenelf/local/secret-staging -maxdepth 1 -type f -name 'secret-stage-*.json' -print -quit)\""
          docker compose up -d --build secret-ops-runner secret-chat-broker
          for i in $(seq 1 40); do
            if docker compose exec -T secret-chat-broker node -e \
              "fetch('http://127.0.0.1:8097/health').then(r => { if (!r.ok) process.exit(1); return r.json(); }).then(v => { if (!v.plaintext_enabled) process.exit(1); })"; then
              break
            fi
            sleep 1
          done
          docker compose exec -T secret-chat-broker node -e \
            "fetch('http://127.0.0.1:8097/v1/targets',{headers:{'x-agenelf-token':'secret-ops-ci-token'}}).then(async r => { if (!r.ok) throw new Error(await r.text()); const v=await r.json(); if (!Array.isArray(v.targets)) process.exit(1); })"
          for i in $(seq 1 30); do
            test -s data/runner-health/secret-ops-runner.json && break
            sleep 1
          done
          grep -q 'node-typescript' data/runner-health/secret-ops-runner.json
          grep -q 'owner-secret-env' data/runner-health/secret-ops-runner.json
          docker compose stop secret-ops-runner secret-chat-broker
      - name: Assert repository artifacts contain no fixture plaintext secrets outside tests
        run: |
          ! grep -R --line-number --fixed-strings 'owner-visible-plaintext-key' \
            --exclude='secret-chat-broker.test.ts' node app docs local scripts .github
          ! grep -R --line-number --fixed-strings 'charlie-owner-updated-C9' \
            --exclude='chat-secret-env.test.ts' node app docs local scripts .github
          ! find local/secret-staging -type f -name 'secret-stage-*.json' -print -quit | grep -q .
