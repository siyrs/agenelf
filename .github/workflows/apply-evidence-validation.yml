name: Apply evidence-driven validation payload

on:
  push:
    branches: [agent/evidence-driven-validation]
    paths:
      - '.agent-payload/**'
      - '.github/workflows/apply-evidence-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - '.agent-payload/**'
      - '.github/workflows/apply-evidence-validation.yml'

permissions:
  contents: write

concurrency:
  group: apply-evidence-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evidence-driven-validation
          fetch-depth: 0

      - name: Validate, decode and apply payload
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-payload/part-* | base64 --decode > /tmp/agenelf-validation-payload.tar.xz
          sha256sum -c .agent-payload/SHA256
          mkdir -p /tmp/agenelf-validation-payload
          tar -xJf /tmp/agenelf-validation-payload.tar.xz -C /tmp/agenelf-validation-payload
          python /tmp/agenelf-validation-payload/apply_changes.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r app/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app scripts

      - name: Run full unit suite
        id: unit
        continue-on-error: true
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/agenelf-unit-tests.log

      - name: Preserve unit-test failure evidence
        if: steps.unit.outcome == 'failure'
        shell: bash
        run: |
          cp /tmp/agenelf-unit-tests.log .agent-test-failure.log
          printf 'unit_tests=failed\n' > .agent-test-status

      - name: Validate shell control-plane scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -maxdepth 1 -type f -name '*.sh' -print0)

      - name: Validate Docker topology and local initialization
        id: docker
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cp .env.example .env
            cp .ops-runner.env.example .ops-runner.env
            python scripts/init_local.py --no-migrate
            docker compose config
          } 2>&1 | tee /tmp/agenelf-docker-validation.log

      - name: Preserve Docker validation failure evidence
        if: steps.docker.outcome == 'failure'
        shell: bash
        run: |
          cp /tmp/agenelf-docker-validation.log .agent-docker-failure.log
          printf 'docker_validation=failed\n' > .agent-docker-status

      - name: Stage and commit expanded implementation
        id: expanded
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'agenelf-ci'
          git config user.email 'agenelf-ci@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'feat: add evidence-driven software validation'
          git format-patch -1 --stdout > /tmp/evidence-validation.patch
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload expanded patch evidence
        if: steps.expanded.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evidence-validation-expanded-patch
          path: /tmp/evidence-validation.patch
          if-no-files-found: error
          retention-days: 3

      - name: Push expanded implementation
        id: push
        if: steps.expanded.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git push origin HEAD:agent/evidence-driven-validation 2>&1 | tee /tmp/agenelf-push.log

      - name: Upload push diagnostics
        if: steps.push.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: evidence-validation-push-diagnostics
          path: /tmp/agenelf-push.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when expanded validation or push failed
        if: steps.unit.outcome == 'failure' || steps.docker.outcome == 'failure' || steps.push.outcome == 'failure'
        run: exit 1
