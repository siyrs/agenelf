name: Apply evidence-driven validation payload

on:
  push:
    branches: [agent/evidence-driven-validation]
    paths:
      - '.agent-payload/**'
      - '.github/workflows/apply-evidence-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - '.agent-payload/**'
      - '.github/workflows/apply-evidence-validation.yml'

permissions:
  contents: write

concurrency:
  group: apply-evidence-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evidence-driven-validation
          fetch-depth: 0

      - name: Validate, decode and apply payload
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-payload/part-* | base64 --decode > /tmp/agenelf-validation-payload.tar.xz
          sha256sum -c .agent-payload/SHA256
          mkdir -p /tmp/agenelf-validation-payload
          tar -xJf /tmp/agenelf-validation-payload.tar.xz -C /tmp/agenelf-validation-payload
          python /tmp/agenelf-validation-payload/apply_changes.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r app/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app scripts

      - name: Run full unit suite
        working-directory: app
        run: python -m unittest discover -s tests -v

      - name: Validate shell control-plane scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -maxdepth 1 -type f -name '*.sh' -print0)

      - name: Validate Docker topology and local initialization
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          cp .ops-runner.env.example .ops-runner.env
          python scripts/init_local.py --no-migrate >/tmp/init-local.json
          docker compose config >/dev/null

      - name: Commit expanded implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'agenelf-ci'
          git config user.email 'agenelf-ci@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No expanded changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add evidence-driven software validation'
          git push origin HEAD:agent/evidence-driven-validation
