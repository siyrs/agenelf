name: Diagnose PR unit tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt
      - name: Capture complete unittest output
        shell: bash
        run: |
          set +e
          cd app
          python -m unittest discover -s tests -v > ../unit-test-diagnostics.log 2>&1
          status=$?
          printf 'exit_code=%s\n' "$status" >> ../unit-test-diagnostics.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          path: unit-test-diagnostics.log
          if-no-files-found: error
