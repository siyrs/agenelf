name: Node Upgrade Governance CI

on:
  push:
    branches: [main]
    paths:
      - "app/core/node_upgrade_policy.py"
      - "app/core/__init__.py"
      - "app/tests/test_node_upgrade_policy.py"
      - "app/tests/test_node_candidate_contract.py"
      - "app/tests/test_node_upgrade_wiring.py"
      - "Dockerfile.control-plane"
      - "docker-compose.yml"
      - ".github/workflows/node-upgrade-governance-ci.yml"
  pull_request:
    paths:
      - "app/core/node_upgrade_policy.py"
      - "app/core/__init__.py"
      - "app/tests/test_node_upgrade_policy.py"
      - "app/tests/test_node_candidate_contract.py"
      - "app/tests/test_node_upgrade_wiring.py"
      - "Dockerfile.control-plane"
      - "docker-compose.yml"
      - ".github/workflows/node-upgrade-governance-ci.yml"

permissions:
  contents: read

jobs:
  node-upgrade-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install locked Python and Node dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          npm ci --ignore-scripts
      - name: Run Node upgrade governance unit tests
        run: |
          PYTHONPATH=app python -m unittest \
            app.tests.test_node_upgrade_policy \
            app.tests.test_node_upgrade_wiring -v
      - name: Validate owner-authorized candidate with complete Python and Node suites
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(mktemp -d)
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=app-tmp \
            --exclude=data \
            --exclude=logs \
            --exclude=local \
            --exclude=workspace \
            -cf - . | tar -xf - -C "$candidate"
          printf '{"schema_version":1,"layout":"repository"}\n' >"$candidate/.agenelf-evolution-workspace.json"
          CANDIDATE="$candidate" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CANDIDATE"])
          manifest = {}
          for path in sorted((root / "app" / "tests").rglob("*")):
              if path.is_file() and not path.is_symlink():
                  manifest[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / "baseline-tests.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python scripts/run_authorized_upgrade_tests.py \
            --candidate-repo "$candidate" \
            --baseline-manifest "$candidate/baseline-tests.json" \
            --timeout 900 | tee node-upgrade-candidate-report.json
          node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync("node-upgrade-candidate-report.json","utf8")); if(value.status!=="passed") process.exit(1)'
      - name: Validate control-plane Compose trust boundary
        run: |
          cp .env.example .env
          printf '\nAGENELF_UID=%s\nAGENELF_GID=%s\n' "$(id -u)" "$(id -g)" >>.env
          cp .ops-runner.env.example .ops-runner.env
          python scripts/init_local.py --no-migrate >/tmp/init.json
          docker compose config --format json >/tmp/compose.json
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('/tmp/compose.json', 'utf8'));
          const runner = config.services?.['self-upgrade-runner'];
          if (!runner) throw new Error('missing self-upgrade-runner');
          if (!String(runner.build?.dockerfile || '').endsWith('Dockerfile.control-plane')) throw new Error('wrong control-plane image');
          if (runner.network_mode !== 'none') throw new Error('self-upgrade runner must be networkless');
          const volumes = runner.volumes || [];
          const target = (item) => typeof item === 'string' ? item.split(':')[1] : item.target;
          const readOnly = (item) => typeof item === 'string' ? item.split(':')[2] === 'ro' : Boolean(item.read_only);
          const has = (path, ro) => volumes.some((item) => target(item) === path && readOnly(item) === ro);
          for (const path of [
            '/agenelf/upgrade-target/node',
            '/agenelf/upgrade-target/contracts',
            '/agenelf/upgrade-target/package.json',
            '/agenelf/upgrade-target/package-lock.json',
            '/agenelf/upgrade-target/Dockerfile.node',
            '/agenelf/upgrade-target/Dockerfile.control-plane'
          ]) if (!has(path, false)) throw new Error(`missing writable authorized target: ${path}`);
          const sources = volumes.map((item) => typeof item === 'string' ? item : String(item.source || '')).join('\n');
          for (const forbidden of ['local/secrets', 'local/profile', 'local/memory', 'docker.sock']) {
            if (sources.includes(forbidden)) throw new Error(`forbidden control-plane mount: ${forbidden}`);
          }
          NODE
      - name: Build and smoke Python plus Node control-plane image
        run: |
          docker build -f Dockerfile.control-plane -t agenelf-control-plane:ci .
          docker run --rm \
            -v "$PWD/app:/agenelf/app-fork:ro" \
            -e PYTHONPATH=/agenelf/app-fork \
            agenelf-control-plane:ci \
            python -c "import sys; from core import authorized_upgrade; assert hasattr(authorized_upgrade, 'NODE_UPGRADE_POLICY_VERSION'); import subprocess; assert subprocess.run(['node','--version']).returncode == 0; print(sys.version)"
