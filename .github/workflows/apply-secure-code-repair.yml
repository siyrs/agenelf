name: Apply secure code repair implementation

on:
  push:
    branches: [agent/secure-code-repair-v1]
    paths:
      - '.agent-secure-repair-v2/**'
      - '.github/workflows/apply-secure-code-repair.yml'
  pull_request:
    branches: [main]
    paths:
      - '.agent-secure-repair-v2/**'
      - '.github/workflows/apply-secure-code-repair.yml'

permissions:
  contents: write

concurrency:
  group: apply-secure-code-repair-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/secure-code-repair-v1
          fetch-depth: 0

      - name: Decode and apply exact implementation payload
        id: apply_payload
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euxo pipefail
            cat .agent-secure-repair-v2/part-* | base64 --decode > /tmp/secure-code-repair-payload.tar.xz
            sha256sum -c .agent-secure-repair-v2/SHA256
            mkdir -p /tmp/secure-code-repair-payload
            tar -xJf /tmp/secure-code-repair-payload.tar.xz -C /tmp/secure-code-repair-payload
            python /tmp/secure-code-repair-payload/apply_changes.py
            python .agent-secure-repair-v2/fix_after_apply.py
          } > /tmp/secure-code-repair-apply.log 2>&1

      - name: Upload payload application diagnostics
        if: steps.apply_payload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: secure-code-repair-apply-diagnostics
          path: /tmp/secure-code-repair-apply.log
          if-no-files-found: error

      - name: Stop after payload application failure
        if: steps.apply_payload.outcome == 'failure'
        shell: bash
        run: |
          cat /tmp/secure-code-repair-apply.log
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r app/requirements.txt

      - name: Validate governance policy
        run: python scripts/validate_governance.py

      - name: Compile Python sources
        run: python -m compileall -q app scripts

      - name: Run complete unit suite
        id: unit_tests
        continue-on-error: true
        shell: bash
        working-directory: app
        run: python -m unittest discover -s tests -v > /tmp/secure-code-repair-tests.log 2>&1

      - name: Upload complete unit-test diagnostics
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: secure-code-repair-test-diagnostics
          path: /tmp/secure-code-repair-tests.log
          if-no-files-found: error

      - name: Stop after unit-test failure
        if: steps.unit_tests.outcome == 'failure'
        shell: bash
        run: |
          tail -n 160 /tmp/secure-code-repair-tests.log
          exit 1

      - name: Validate local initialization and Docker topology
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          cp .ops-runner.env.example .ops-runner.env
          python scripts/init_local.py --no-migrate >/tmp/init-local.json
          grep -q '"repositories": true' /tmp/init-local.json
          grep -q '"code_workspaces": true' /tmp/init-local.json
          grep -q '"repair_space": true' /tmp/init-local.json
          docker compose config >/dev/null

      - name: Validate all shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -maxdepth 1 -type f -name '*.sh' -print0)

      - name: Remove transport-only payload and workflow
        shell: bash
        run: rm -rf .agent-secure-repair .agent-secure-repair-v2 .github/workflows/apply-secure-code-repair.yml

      - name: Commit and push verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'agenelf-ci'
          git config user.email 'agenelf-ci@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add isolated code repair and harden dynamic code paths'
          git push origin HEAD:agent/secure-code-repair-v1
