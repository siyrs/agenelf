name: Apply Docker self-recovery fix

on:
  push:
    branches:
      - fix/docker-ops-self-recovery-20260725
    paths:
      - tools/apply_docker_self_recovery_fix.py

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Apply deterministic patch
        run: python tools/apply_docker_self_recovery_fix.py
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r app/requirements.txt
      - name: Validate governance and compile
        run: |
          python scripts/validate_governance.py
          python -m compileall -q app scripts
      - name: Run complete unit suite
        working-directory: app
        run: python -m unittest discover -s tests -v
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app scripts local config docker-compose.yml Makefile docs
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "fix: make Docker operations self-recovering"
          git push origin HEAD:${{ github.ref_name }}
