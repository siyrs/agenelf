schema_version: 1

# 默认不启用任何密钥目标，旧安装执行 make init 后不会因示例服务器别名而启动失败。
# 该文件只描述“哪里有密钥、稳定席位 ID 对应哪个环境变量、如何重载服务”。
# 不要在这里写任何完整密钥。实际文件 local/env-secrets.yaml 已被 Git 忽略。
targets: {}

# 配置示例（取消注释并按你的 local/servers.yaml 与服务器路径修改）：
# targets:
#   relay-zhipu:
#     # 必须引用 local/servers.yaml 中已存在的服务器别名。
#     server: relay-prod
#
#     # 必须位于该服务器 managed_root 下。推荐把普通配置和密钥拆分，
#     # 例如 compose.yaml 加载 .env 和 .env.secrets。
#     env_file: /srv/new-api/.env.secrets
#
#     # 席位 ID 是稳定身份。删除 zhipu-b 后，zhipu-c 和 zhipu-d 不会重编号。
#     seats:
#       zhipu-a:
#         env: ZHIPU_SEAT_A_API_KEY
#         label: 智谱主席位
#       zhipu-b:
#         env: ZHIPU_SEAT_B_API_KEY
#         label: 智谱备用席位 B
#       zhipu-c:
#         env: ZHIPU_SEAT_C_API_KEY
#         label: 智谱备用席位 C
#       zhipu-d:
#         env: ZHIPU_SEAT_D_API_KEY
#         label: 智谱备用席位 D
#
#     # 修改成功后先执行 Compose config，再原子重载；失败会恢复旧密钥并重新部署。
#     # 不需要自动重载时使用：reload: {type: none}
#     reload:
#       type: compose
#       workdir: /srv/new-api
#       compose_file: /srv/new-api/compose.yaml
#       project: new-api
#       health_container: new-api
