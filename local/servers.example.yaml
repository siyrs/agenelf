# Copy/migrate to local/servers.yaml. Never put password or private-key contents here.
servers:
  primary:
    host: 192.0.2.10
    port: 22
    username: agenelf
    connect_timeout: 10
    auth:
      type: private_key
      private_key: primary_ed25519
      # passphrase_env: AGENELF_SSH_PRIMARY_PASSPHRASE
    known_hosts: known_hosts
    allow_unknown_host_key: false
    managed_root: /srv/agenelf
    docker_command: docker
    allowed_operations:
      - inspect
      - docker_ps
      - service_status
      - apt_update
      - compose_deploy
      # Safe inverse lifecycle action. It never removes volumes or images and still
      # requires an exact owner approval for every target/project/parameter set.
      - compose_down
      - service_restart
      - docker_install
    allowed_docker_operations:
      - get_docker_logs
      - inspect_docker_container
      - run_docker_check
      - restart_docker_container
    # Optional: omit allowed_containers to permit any syntactically valid name.
    # allowed_containers:
    #   - sing-box
    # Optional: model selects only the alias; Runner owns the exact argv below.
    # docker_checks:
    #   sing-box-config:
    #     container: sing-box
    #     argv: [sing-box, check, -c, /etc/sing-box/config.json]
    allowed_services:
      - docker
      - nginx
    allowed_bind_roots:
      - /srv/agenelf-data
