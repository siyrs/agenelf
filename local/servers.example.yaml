# Copy/migrate to local/servers.yaml. Never put password or private-key contents here.
servers:
  primary:
    host: 192.0.2.10
    port: 22
    username: agenelf
    connect_timeout: 10
    auth:
      type: private_key
      private_key: primary_ed25519
      # passphrase_env: AGENELF_SSH_PRIMARY_PASSPHRASE
    known_hosts: known_hosts
    allow_unknown_host_key: false
    managed_root: /srv/agenelf
    docker_command: docker
    allowed_operations:
      - inspect
      - docker_ps
      - service_status
      - apt_update
      - compose_deploy
      - service_restart
      - docker_install
    allowed_services:
      - docker
      - nginx
    allowed_bind_roots:
      - /srv/agenelf-data
