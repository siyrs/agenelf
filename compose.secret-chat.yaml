# Owner-authorized plaintext secret broker for Agenelf chat.
# The broker is reachable only on the Compose network. It owns SSH credentials;
# the Agent receives plaintext only through fixed target/seat HTTP operations.
services:
  secret-chat-broker:
    image: agenelf-secret-ops:local
    build:
      context: .
      dockerfile: Dockerfile.ops-secret
    command: [node, node/apps/secret-chat-broker/src/main.ts]
    env_file:
      - .env
      - .ops-runner.env
    user: "${AGENELF_UID:-1000}:${AGENELF_GID:-1000}"
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_SERVERS_FILE: /agenelf/local/servers.yaml
      AGENELF_SECRETS_DIR: /agenelf/local/secrets
      AGENELF_ENV_SECRETS_FILE: /agenelf/local/env-secrets.yaml
      AGENELF_SECRET_CHAT_HOST: 0.0.0.0
      AGENELF_SECRET_CHAT_PORT: "8097"
      AGENELF_CHAT_PLAINTEXT_SECRETS: "${AGENELF_CHAT_PLAINTEXT_SECRETS:-true}"
    expose: ["8097"]
    volumes:
      - ./node:/agenelf/node:ro
      - ./local/servers.yaml:/agenelf/local/servers.yaml:ro
      - ./local/env-secrets.yaml:/agenelf/local/env-secrets.yaml:ro
      - ./local/secrets:/agenelf/local/secrets:ro
      - ./logs:/agenelf/logs:rw
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 128
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
