# Runtime source-of-truth override.
#
# The base topology keeps the historical app-fork mount for compatibility. The
# default Compose invocation automatically loads this file and replaces that mount
# target with ./app, so a normal recreate cannot keep executing a stale fork after
# the repository has been updated. The deterministic runners remain isolated and
# read-only; only their Python source mount changes.
services:
  agenelf:
    volumes:
      - ./app:/agenelf/app-fork:ro

  ops-runner:
    command: ["python", "/agenelf/scripts/ops_runner_v2.py", "--interval", "1"]
    volumes:
      - ./app:/agenelf/app-fork:ro

  validation-runner:
    volumes:
      - ./app:/agenelf/app-fork:ro

  repair-runner:
    volumes:
      - ./app:/agenelf/app-fork:ro
