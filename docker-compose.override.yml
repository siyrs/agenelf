# Compatibility personalization overlay for explicit docker-compose.yml stacks.
# The default compose.yaml path governs this file through node-self-upgrade-runner in
# compose.override.yaml; legacy/canary stacks retain their existing service identity.
services:
  agenelf:
    volumes:
      - ./local/prompts:/agenelf/local/prompts:ro

  cli:
    volumes:
      - ./local/prompts:/agenelf/local/prompts:ro

  self-upgrade-runner:
    volumes:
      - ./docker-compose.override.yml:/agenelf/upgrade-target/docker-compose.override.yml:rw
