# Agenelf 编排文件
# 安全边界核心：
#   - app/（代码真理之源）绝不挂载进容器，agent 无法直接触碰；
#   - 容器内唯一可写代码区是 app-tmp/；
#   - 绝不挂载 /var/run/docker.sock，防止 agent 逃逸控制宿主机。
services:
  agenelf:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # 运行代码（sync_fork.sh 从 app/ 生成），只读，防止运行中被篡改
      - ./app-fork:/agenelf/app-fork:ro
      # agent 自我迭代暂存区，容器内唯一可写代码区
      - ./app-tmp:/agenelf/app-tmp:rw
      # 底线脚本与文档，只读挂载：agent 只能触发，不能修改
      - ./scripts:/agenelf/scripts:ro
      # 运行时数据
      - ./data:/agenelf/data:rw
      - ./logs:/agenelf/logs:rw
      # 给 agent 指派的任务保存目录
      - ./workspace:/agenelf/workspace:rw
      # agent 的能力资产：skills / mcp / plugins
      - ./app-space:/agenelf/app-space:rw
    restart: unless-stopped
