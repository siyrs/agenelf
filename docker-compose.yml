# Agenelf split-runtime deployment.
# The Agent can propose operations but has no SSH key, Docker socket, or trusted
# result write access.  ops-runner is deterministic and owns the remote creds.
services:
  agenelf:
    build: .
    env_file: .env
    user: "${AGENELF_UID:-1000}:${AGENELF_GID:-1000}"
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_SERVERS_FILE: /agenelf/config/servers.yaml
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app-fork:/agenelf/app-fork:ro
      - ./app-tmp:/agenelf/app-tmp:rw
      - ./scripts:/agenelf/scripts:ro
      - ./config:/agenelf/config:ro
      - ./data:/agenelf/data:rw
      # Human decisions and runner results are trusted inputs, never Agent output.
      - ./data/auth-decisions:/agenelf/data/auth-decisions:ro
      - ./data/ops-results:/agenelf/data/ops-results:ro
      - ./logs:/agenelf/logs:rw
      - ./workspace:/agenelf/workspace:rw
      - ./app-space:/agenelf/app-space:rw
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ops-runner:
    build: .
    command: ["python", "/agenelf/scripts/ops_runner.py", "--interval", "1"]
    env_file: .ops-runner.env
    user: "${AGENELF_UID:-1000}:${AGENELF_GID:-1000}"
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_SERVERS_FILE: /agenelf/config/servers.yaml
      AGENELF_SECRETS_DIR: /agenelf/secrets
    volumes:
      - ./app-fork:/agenelf/app-fork:ro
      - ./scripts:/agenelf/scripts:ro
      - ./config:/agenelf/config:ro
      - ./secrets:/agenelf/secrets:ro
      - ./data/ops-requests:/agenelf/data/ops-requests:ro
      - ./data/auth-decisions:/agenelf/data/auth-decisions:ro
      - ./data/ops-results:/agenelf/data/ops-results:rw
      - ./data/ops-locks:/agenelf/data/ops-locks:rw
      - ./logs:/agenelf/logs:rw
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
