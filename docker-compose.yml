# Agenelf split-runtime deployment with private owner data and deterministic runners.
services:
  agenelf:
    build: .
    env_file: .env
    user: "${AGENELF_UID:-1000}:${AGENELF_GID:-1000}"
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_LOCAL_DIR: /agenelf/local
      AGENELF_SELF_DIR: /agenelf/local/self
      AGENELF_SERVERS_FILE: /agenelf/local/servers.yaml
      AGENELF_VALIDATION_FILE: /agenelf/local/validation.yaml
      AGENELF_MODELS_FILE: /agenelf/local/models.yaml
      AGENELF_REPOSITORIES_FILE: /agenelf/local/repositories.yaml
      AGENELF_SCRATCH_DIR: /agenelf/workspace/scratch
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app-fork:/agenelf/app-fork:ro
      - ./app-tmp:/agenelf/app-tmp:rw
      - ./scripts:/agenelf/scripts:ro
      - ./data:/agenelf/data:rw
      - ./data/auth-decisions:/agenelf/data/auth-decisions:ro
      - ./data/ops-results:/agenelf/data/ops-results:ro
      - ./data/validation-results:/agenelf/data/validation-results:ro
      - ./data/repair-results:/agenelf/data/repair-results:ro
      - ./logs:/agenelf/logs:rw
      - ./workspace:/agenelf/workspace:rw
      - ./app-space:/agenelf/app-space:rw
      - ./local/profile.yaml:/agenelf/local/profile.yaml:ro
      - ./local/preferences.yaml:/agenelf/local/preferences.yaml:ro
      - ./local/context:/agenelf/local/context:ro
      - ./local/servers.yaml:/agenelf/local/servers.yaml:ro
      - ./local/validation.yaml:/agenelf/local/validation.yaml:ro
      - ./local/models.yaml:/agenelf/local/models.yaml:ro
      - ./local/repositories.yaml:/agenelf/local/repositories.yaml:ro
      - ./local/memory:/agenelf/local/memory:rw
      - ./local/self:/agenelf/local/self:rw
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ops-runner:
    build: .
    command: ["python", "/agenelf/scripts/ops_runner.py", "--interval", "1"]
    env_file: .ops-runner.env
    user: "${AGENELF_UID:-1000}:${AGENELF_GID:-1000}"
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_LOCAL_DIR: /agenelf/local
      AGENELF_SERVERS_FILE: /agenelf/local/servers.yaml
      AGENELF_SECRETS_DIR: /agenelf/local/secrets
    volumes:
      - ./app-fork:/agenelf/app-fork:ro
      - ./scripts:/agenelf/scripts:ro
      - ./local/servers.yaml:/agenelf/local/servers.yaml:ro
      - ./local/secrets:/agenelf/local/secrets:ro
      - ./data/ops-requests:/agenelf/data/ops-requests:ro
      - ./data/auth-decisions:/agenelf/data/auth-decisions:ro
      - ./data/ops-results:/agenelf/data/ops-results:rw
      - ./data/ops-locks:/agenelf/data/ops-locks:rw
      - ./logs:/agenelf/logs:rw
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  validation-runner:
    build: .
    command: ["python", "/agenelf/scripts/validation_runner.py", "--interval", "1"]
    user: "${AGENELF_UID:-1000}:${AGENELF_GID:-1000}"
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_LOCAL_DIR: /agenelf/local
      AGENELF_VALIDATION_FILE: /agenelf/local/validation.yaml
    volumes:
      - ./app-fork:/agenelf/app-fork:ro
      - ./scripts:/agenelf/scripts:ro
      - ./local/validation.yaml:/agenelf/local/validation.yaml:ro
      - ./data/validation-requests:/agenelf/data/validation-requests:ro
      - ./data/validation-results:/agenelf/data/validation-results:rw
      - ./data/validation-locks:/agenelf/data/validation-locks:rw
      - ./logs:/agenelf/logs:rw
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  repair-runner:
    build: .
    command: ["python", "/agenelf/scripts/repair_runner.py", "--interval", "1"]
    user: "${AGENELF_UID:-1000}:${AGENELF_GID:-1000}"
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_REPOSITORIES_FILE: /agenelf/local/repositories.yaml
      AGENELF_CODE_WORKSPACES: /agenelf/code-workspaces
      AGENELF_REPAIR_SPACE: /agenelf/repair-space
    volumes:
      - ./app-fork:/agenelf/app-fork:ro
      - ./scripts:/agenelf/scripts:ro
      - ./local/repositories.yaml:/agenelf/local/repositories.yaml:ro
      - ./code-workspaces:/agenelf/code-workspaces:ro
      - ./repair-space:/agenelf/repair-space:rw
      - ./data/repair-requests:/agenelf/data/repair-requests:ro
      - ./data/repair-results:/agenelf/data/repair-results:rw
      - ./data/repair-locks:/agenelf/data/repair-locks:rw
      - ./logs:/agenelf/logs:rw
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 1g
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
