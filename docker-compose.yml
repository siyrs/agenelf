# Agenelf production topology: Node.js/TypeScript is the public Agent/API/CLI.
# The Python API remains internal-only as a compatibility adapter for endpoints
# that have not yet migrated. Deterministic security runners keep their original
# isolated trust domains until each one is migrated and re-validated separately.
services:
  approval-key-init:
    extends:
      file: docker-compose.python.yml
      service: approval-key-init

  legacy-agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    user: "${AGENELF_UID:-1000}:${AGENELF_GID:-1000}"
    depends_on:
      approval-key-init:
        condition: service_completed_successfully
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_LOCAL_DIR: /agenelf/local
      AGENELF_SELF_DIR: /agenelf/local/self
      AGENELF_SERVERS_FILE: /agenelf/local/servers.yaml
      AGENELF_VALIDATION_FILE: /agenelf/local/validation.yaml
      AGENELF_MODELS_FILE: /agenelf/local/models.yaml
      AGENELF_REPOSITORIES_FILE: /agenelf/local/repositories.yaml
      AGENELF_SCRATCH_DIR: /agenelf/workspace/scratch
      AGENELF_RUNTIME_SOURCE: app-bind
    expose:
      - "8000"
    volumes:
      - ./app:/agenelf/app-fork:ro
      - ./app-tmp:/agenelf/app-tmp:rw
      - ./scripts:/agenelf/scripts:ro
      - ./policy:/agenelf/policy:ro
      - ./.github:/agenelf/repo-source/.github:ro
      - ./docs:/agenelf/repo-source/docs:ro
      - ./Dockerfile:/agenelf/repo-source/Dockerfile:ro
      - ./Dockerfile.node:/agenelf/repo-source/Dockerfile.node:ro
      - ./Makefile:/agenelf/repo-source/Makefile:ro
      - ./README.md:/agenelf/repo-source/README.md:ro
      - ./docker-compose.yml:/agenelf/repo-source/docker-compose.yml:ro
      - ./docker-compose.python.yml:/agenelf/repo-source/docker-compose.python.yml:ro
      - ./package.json:/agenelf/repo-source/package.json:ro
      - ./package-lock.json:/agenelf/repo-source/package-lock.json:ro
      - ./node:/agenelf/repo-source/node:ro
      - ./.env.example:/agenelf/repo-source/.env.example:ro
      - ./.ops-runner.env.example:/agenelf/repo-source/.ops-runner.env.example:ro
      - ./.gitignore:/agenelf/repo-source/.gitignore:ro
      - ./.gitleaks.toml:/agenelf/repo-source/.gitleaks.toml:ro
      - ./config/servers.example.yaml:/agenelf/repo-source/config/servers.example.yaml:ro
      - ./local/profile.example.yaml:/agenelf/repo-source/local/profile.example.yaml:ro
      - ./local/preferences.example.yaml:/agenelf/repo-source/local/preferences.example.yaml:ro
      - ./local/servers.example.yaml:/agenelf/repo-source/local/servers.example.yaml:ro
      - ./local/validation.example.yaml:/agenelf/repo-source/local/validation.example.yaml:ro
      - ./local/models.example.yaml:/agenelf/repo-source/local/models.example.yaml:ro
      - ./local/repositories.example.yaml:/agenelf/repo-source/local/repositories.example.yaml:ro
      - ./local/context.example.md:/agenelf/repo-source/local/context.example.md:ro
      - ./local/self/intentions.template.json:/agenelf/repo-source/local/self/intentions.template.json:ro
      - ./data:/agenelf/data:rw
      - ./data/auth-decisions:/agenelf/data/auth-decisions:ro
      - ./data/ops-results:/agenelf/data/ops-results:ro
      - ./data/ops-locks:/agenelf/data/ops-locks:ro
      - ./data/approval-commands:/agenelf/data/approval-commands:ro
      - ./data/approval-results:/agenelf/data/approval-results:ro
      - ./data/approval-locks:/agenelf/data/approval-locks:ro
      - ./data/validation-results:/agenelf/data/validation-results:ro
      - ./data/validation-locks:/agenelf/data/validation-locks:ro
      - ./data/repair-results:/agenelf/data/repair-results:ro
      - ./data/repair-locks:/agenelf/data/repair-locks:ro
      - ./data/self-upgrade-results:/agenelf/data/self-upgrade-results:ro
      - ./data/self-upgrade-locks:/agenelf/data/self-upgrade-locks:ro
      - ./data/promote-requests:/agenelf/data/promote-requests:ro
      - ./data/promotion-history:/agenelf/data/promotion-history:ro
      - ./data/runner-health:/agenelf/data/runner-health:ro
      - ./logs:/agenelf/logs:rw
      - ./workspace:/agenelf/workspace:rw
      - ./app-space:/agenelf/app-space:rw
      - ./local/profile.yaml:/agenelf/local/profile.yaml:ro
      - ./local/preferences.yaml:/agenelf/local/preferences.yaml:ro
      - ./local/context:/agenelf/local/context:ro
      - ./local/servers.yaml:/agenelf/local/servers.yaml:ro
      - ./local/validation.yaml:/agenelf/local/validation.yaml:ro
      - ./local/models.yaml:/agenelf/local/models.yaml:ro
      - ./local/repositories.yaml:/agenelf/local/repositories.yaml:ro
      - ./local/memory:/agenelf/local/memory:rw
      - ./local/self:/agenelf/local/self:rw
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  agenelf:
    build:
      context: .
      dockerfile: Dockerfile.node
    env_file: .env
    user: "${AGENELF_UID:-1000}:${AGENELF_GID:-1000}"
    depends_on:
      legacy-agent:
        condition: service_started
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_HOST: 0.0.0.0
      AGENELF_PORT: 8000
      AGENELF_LEGACY_API_URL: http://legacy-agent:8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./node:/agenelf/node:ro
      - ./web:/agenelf/web:ro
      - ./docs:/agenelf/docs:ro
      - ./local/profile.yaml:/agenelf/local/profile.yaml:ro
      - ./local/preferences.yaml:/agenelf/local/preferences.yaml:ro
      - ./local/context:/agenelf/local/context:ro
      - ./local/memory:/agenelf/local/memory:rw
      - ./local/self:/agenelf/local/self:rw
      - ./data/node-tasks:/agenelf/data/node-tasks:rw
      - ./data/ops-requests:/agenelf/data/ops-requests:rw
      - ./data/ops-results:/agenelf/data/ops-results:ro
      - ./data/auth-decisions:/agenelf/data/auth-decisions:ro
      - ./data/node-runner-requests:/agenelf/data/node-runner-requests:rw
      - ./data/node-runner-results:/agenelf/data/node-runner-results:ro
      - ./logs:/agenelf/logs:rw
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  cli:
    build:
      context: .
      dockerfile: Dockerfile.node
    profiles: ["cli"]
    command: ["node", "node/apps/cli/src/main.ts"]
    env_file: .env
    user: "${AGENELF_UID:-1000}:${AGENELF_GID:-1000}"
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_LEGACY_API_URL: http://legacy-agent:8000
    volumes:
      - ./node:/agenelf/node:ro
      - ./docs:/agenelf/docs:ro
      - ./local/profile.yaml:/agenelf/local/profile.yaml:ro
      - ./local/preferences.yaml:/agenelf/local/preferences.yaml:ro
      - ./local/context:/agenelf/local/context:ro
      - ./local/memory:/agenelf/local/memory:rw
      - ./local/self:/agenelf/local/self:rw
      - ./data/node-tasks:/agenelf/data/node-tasks:rw
      - ./data/ops-requests:/agenelf/data/ops-requests:rw
      - ./data/ops-results:/agenelf/data/ops-results:ro
      - ./data/auth-decisions:/agenelf/data/auth-decisions:ro
      - ./logs:/agenelf/logs:rw
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  legacy-cli:
    extends:
      file: docker-compose.python.yml
      service: cli
    profiles: ["legacy-cli"]

  node-runner:
    build:
      context: .
      dockerfile: Dockerfile.node
    command: ["node", "node/apps/runner/src/main.ts"]
    profiles: ["node-runner"]
    user: "${AGENELF_UID:-1000}:${AGENELF_GID:-1000}"
    environment:
      AGENELF_ROOT: /agenelf
    volumes:
      - ./node:/agenelf/node:ro
      - ./local/node-runner.json:/agenelf/local/node-runner.json:ro
      - ./data/node-runner-requests:/agenelf/data/node-runner-requests:ro
      - ./data/node-runner-results:/agenelf/data/node-runner-results:rw
      - ./data/node-runner-locks:/agenelf/data/node-runner-locks:rw
      - ./workspace:/agenelf/workspace:ro
      - ./repair-space:/agenelf/repair-space:ro
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ops-runner:
    extends:
      file: docker-compose.python.yml
      service: ops-runner

  approval-runner:
    extends:
      file: docker-compose.python.yml
      service: approval-runner

  self-upgrade-runner:
    extends:
      file: docker-compose.python.yml
      service: self-upgrade-runner

  validation-runner:
    extends:
      file: docker-compose.python.yml
      service: validation-runner

  repair-runner:
    extends:
      file: docker-compose.python.yml
      service: repair-runner

volumes:
  approval-key:
