# Default Node personalization, owner-approval, operations, repair and self-upgrade overlay.
# Explicit `docker compose -f docker-compose.python.yml ...` rollback does not load it.
services:
  agenelf:
    volumes:
      - ./local/prompts:/agenelf/local/prompts:ro
      - ./data/ops-events:/agenelf/data/ops-events:ro
      - ./data/repair-events:/agenelf/data/repair-events:ro
      - ./data/self-upgrade-results:/agenelf/data/self-upgrade-results:ro
      - ./data/self-upgrade-events:/agenelf/data/self-upgrade-events:ro

  cli:
    group_add: ["0"]
    volumes:
      - ./local/prompts:/agenelf/local/prompts:ro
      - ./data/auth-requests:/agenelf/data/auth-requests:ro
      - ./data/ops-requests:/agenelf/data/ops-requests:ro
      - ./data/auth-decisions:/agenelf/data/auth-decisions:ro
      - ./data/ops-results:/agenelf/data/ops-results:ro
      - ./data/approval-commands:/agenelf/data/approval-commands:rw
      - ./data/approval-results:/agenelf/data/approval-results:ro
      - ./data/approval-locks:/agenelf/data/approval-locks:rw
      - ./data/ops-events:/agenelf/data/ops-events:ro
      - ./data/repair-events:/agenelf/data/repair-events:ro
      - ./data/self-upgrade-results:/agenelf/data/self-upgrade-results:ro
      - ./data/self-upgrade-events:/agenelf/data/self-upgrade-events:ro

  approval-key-init:
    image: agenelf-node:local
    build:
      context: .
      dockerfile: Dockerfile.node
    command: [node, node/apps/approval-key-init/src/main.ts]
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_APPROVAL_KEY_FILE: /agenelf/approval/key
    user: "0:0"

  approval-runner:
    image: agenelf-node:local
    build:
      context: .
      dockerfile: Dockerfile.node
    command: [node, node/apps/approval-runner/src/main.ts]
    group_add: ["0"]
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_APPROVAL_KEY_FILE: /agenelf/approval/key
      AGENELF_APPROVAL_INTERVAL_MS: "250"
    volumes:
      - ./data/ops-results:/agenelf/data/ops-results:ro

  ops-runner:
    profiles: [python-ops]

  read-ops-runner:
    image: agenelf-read-ops:local
    build:
      context: .
      dockerfile: Dockerfile.ops-read
    command: [node, node/apps/read-ops-runner/src/main.ts]
    env_file: .ops-runner.env
    user: "${AGENELF_UID:-1000}:${AGENELF_GID:-1000}"
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_SERVERS_FILE: /agenelf/local/servers.yaml
      AGENELF_SECRETS_DIR: /agenelf/local/secrets
      AGENELF_READ_OPS_INTERVAL_MS: "500"
    volumes:
      - ./node:/agenelf/node:ro
      - ./local/servers.yaml:/agenelf/local/servers.yaml:ro
      - ./local/secrets:/agenelf/local/secrets:ro
      - ./data/ops-requests:/agenelf/data/ops-requests:ro
      - ./data/ops-results:/agenelf/data/ops-results:rw
      - ./data/ops-locks:/agenelf/data/ops-locks:rw
      - ./data/ops-events:/agenelf/data/ops-events:rw
      - ./data/runner-health:/agenelf/data/runner-health:rw
      - ./logs:/agenelf/logs:rw
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  change-ops-runner:
    image: agenelf-change-ops:local
    build:
      context: .
      dockerfile: Dockerfile.ops-change
    command: [node, node/apps/change-ops-runner/src/main.ts]
    env_file: .ops-runner.env
    user: "${AGENELF_UID:-1000}:${AGENELF_GID:-1000}"
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_SERVERS_FILE: /agenelf/local/servers.yaml
      AGENELF_SECRETS_DIR: /agenelf/local/secrets
      AGENELF_CHANGE_OPS_INTERVAL_MS: "500"
    volumes:
      - ./node:/agenelf/node:ro
      - ./local/servers.yaml:/agenelf/local/servers.yaml:ro
      - ./local/secrets:/agenelf/local/secrets:ro
      - ./data/ops-requests:/agenelf/data/ops-requests:ro
      - ./data/auth-decisions:/agenelf/data/auth-decisions:ro
      - ./data/ops-results:/agenelf/data/ops-results:rw
      - ./data/ops-locks:/agenelf/data/ops-locks:rw
      - ./data/ops-events:/agenelf/data/ops-events:rw
      - ./data/runner-health:/agenelf/data/runner-health:rw
      - ./logs:/agenelf/logs:rw
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 128
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  repair-runner:
    profiles: [python-repair]

  node-repair-runner:
    image: agenelf-repair:local
    build:
      context: .
      dockerfile: Dockerfile.repair
    command: [node, node/apps/repair-runner/src/main.ts]
    user: "${AGENELF_UID:-1000}:${AGENELF_GID:-1000}"
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_REPOSITORIES_FILE: /agenelf/local/repositories.yaml
      AGENELF_CODE_WORKSPACES: /agenelf/code-workspaces
      AGENELF_REPAIR_SPACE: /agenelf/repair-space
      AGENELF_REPAIR_INTERVAL_MS: "500"
    volumes:
      - ./node:/agenelf/node:ro
      - ./local/repositories.yaml:/agenelf/local/repositories.yaml:ro
      - ./code-workspaces:/agenelf/code-workspaces:ro
      - ./repair-space:/agenelf/repair-space:rw
      - ./data/repair-requests:/agenelf/data/repair-requests:ro
      - ./data/repair-results:/agenelf/data/repair-results:rw
      - ./data/repair-locks:/agenelf/data/repair-locks:rw
      - ./data/repair-events:/agenelf/data/repair-events:rw
      - ./data/runner-health:/agenelf/data/runner-health:rw
      - ./logs:/agenelf/logs:rw
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 128
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  # Preserve the original Python application implementation only for explicit diagnosis.
  # The complete docker-compose.python.yml rollback remains profile-free.
  self-upgrade-runner:
    profiles: [python-self-upgrade]

  node-self-upgrade-runner:
    image: agenelf-control-plane:local
    build:
      context: .
      dockerfile: Dockerfile.control-plane
    command: [node, node/apps/self-upgrade-runner/src/main.ts]
    user: "${AGENELF_UID:-1000}:${AGENELF_GID:-1000}"
    environment:
      AGENELF_ROOT: /agenelf
      AGENELF_UPGRADE_TARGET: /agenelf/upgrade-target
      AGENELF_REDLINE_BASE_ROOT: /agenelf/upgrade-target
      AGENELF_SELF_UPGRADE_INTERVAL_MS: "500"
    volumes:
      - ./node:/agenelf/node:ro
      - ./scripts:/agenelf/scripts:ro
      - ./app-tmp:/agenelf/app-tmp:ro
      - ./data/authorized-upgrades:/agenelf/data/authorized-upgrades:ro
      - ./data/self-upgrade-requests:/agenelf/data/self-upgrade-requests:ro
      - ./data/self-upgrade-results:/agenelf/data/self-upgrade-results:rw
      - ./data/self-upgrade-locks:/agenelf/data/self-upgrade-locks:rw
      - ./data/self-upgrade-backups:/agenelf/data/self-upgrade-backups:rw
      - ./data/self-upgrade-events:/agenelf/data/self-upgrade-events:rw
      - ./data/auth-requests:/agenelf/data/auth-requests:ro
      - ./data/auth-decisions:/agenelf/data/auth-decisions:ro
      - ./data/auth-consumed:/agenelf/data/auth-consumed:rw
      - ./data/runner-health:/agenelf/data/runner-health:rw
      - ./logs:/agenelf/logs:rw
      - ./app:/agenelf/upgrade-target/app:rw
      - ./scripts:/agenelf/upgrade-target/scripts:rw
      - ./policy:/agenelf/upgrade-target/policy:rw
      - ./node:/agenelf/upgrade-target/node:rw
      - ./contracts:/agenelf/upgrade-target/contracts:rw
      - ./.github:/agenelf/upgrade-target/.github:rw
      - ./docs:/agenelf/upgrade-target/docs:rw
      - ./README.md:/agenelf/upgrade-target/README.md:rw
      - ./Makefile:/agenelf/upgrade-target/Makefile:rw
      - ./Dockerfile:/agenelf/upgrade-target/Dockerfile:rw
      - ./Dockerfile.node:/agenelf/upgrade-target/Dockerfile.node:rw
      - ./Dockerfile.control-plane:/agenelf/upgrade-target/Dockerfile.control-plane:rw
      - ./Dockerfile.ops-read:/agenelf/upgrade-target/Dockerfile.ops-read:rw
      - ./Dockerfile.ops-change:/agenelf/upgrade-target/Dockerfile.ops-change:rw
      - ./Dockerfile.repair:/agenelf/upgrade-target/Dockerfile.repair:rw
      - ./compose.yaml:/agenelf/upgrade-target/compose.yaml:rw
      - ./compose.override.yaml:/agenelf/upgrade-target/compose.override.yaml:rw
      - ./docker-compose.override.yml:/agenelf/upgrade-target/docker-compose.override.yml:rw
      - ./docker-compose.yml:/agenelf/upgrade-target/docker-compose.yml:rw
      - ./docker-compose.python.yml:/agenelf/upgrade-target/docker-compose.python.yml:rw
      - ./docker-compose.node-approval.yml:/agenelf/upgrade-target/docker-compose.node-approval.yml:rw
      - ./package.json:/agenelf/upgrade-target/package.json:rw
      - ./package-lock.json:/agenelf/upgrade-target/package-lock.json:rw
      - ./.node-version:/agenelf/upgrade-target/.node-version:rw
      - ./.env.example:/agenelf/upgrade-target/.env.example:rw
      - ./.ops-runner.env.example:/agenelf/upgrade-target/.ops-runner.env.example:rw
      - ./.gitignore:/agenelf/upgrade-target/.gitignore:rw
      - ./.gitleaks.toml:/agenelf/upgrade-target/.gitleaks.toml:rw
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 256
    mem_limit: 2g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
